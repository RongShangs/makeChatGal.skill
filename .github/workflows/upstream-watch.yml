name: Watch ChatGal compatibility
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: chatgal-upstream-watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: RongShangs/ChatGal
          ref: main
          path: _upstream
      - name: Detect contract drift without silently accepting it
        shell: bash
        run: |
          set +e
          python skills/make-chatgal/scripts/upstream.py check --project _upstream --output compatibility-report.json
          result=$?
          set -e
          if [ "$result" -ne 0 ] && [ "$result" -ne 3 ]; then exit "$result"; fi
      - name: Maintain one compatibility task
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/update_compat_issue.py
